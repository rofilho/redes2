<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title>Posicionamento das ACLs no caminho do PC de origem até o servidor, passando pelo R1 e pelo R2. A ACL estendida fica na entrada do R1, perto da origem: o tráfego proibido é barrado cedo e só o permitido atravessa a rede. A ACL padrão teria de ficar perto do destino, na saída do R2 para o servidor, quando o pacote proibido já cruzou o R1 e o R2.</title>
  <defs>
    <style>
      text { paint-order: stroke; stroke: #fafaf8; stroke-width: 3px; stroke-linejoin: round; }
      text.inv { stroke: none; }
    </style>
    <marker id="seta-v" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d52"/>
    </marker>
  </defs>
  <rect id="fundo-card" x="0" y="0" width="900" height="430" rx="18" fill="#fafaf8"/>

  <text x="450" y="34" text-anchor="middle" font-size="24" fill="#1d2057" font-weight="600">Estendida perto da origem, padrão perto do destino</text>

  <!-- cabos -->
  <line x1="140" y1="190" x2="260" y2="190" stroke="#8a8f98" stroke-width="2"/>
  <line x1="380" y1="190" x2="520" y2="190" stroke="#8a8f98" stroke-width="2"/>
  <line x1="640" y1="190" x2="760" y2="190" stroke="#8a8f98" stroke-width="2"/>

  <!-- caminho do tráfego permitido -->
  <path d="M320,158 L320,140 L820,140 L820,155" fill="none" stroke="#2e7d52" stroke-width="2.5" marker-end="url(#seta-v)"/>
  <text x="570" y="128" text-anchor="middle" font-size="13" fill="#2e7d52" font-weight="700">só o tráfego permitido atravessa</text>

  <!-- ACL estendida (no R1, entrada) -->
  <rect x="131" y="92" width="190" height="26" rx="13" fill="#b1541b"/>
  <text x="226" y="109" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="700" class="inv">ACL estendida · in</text>
  <line x1="226" y1="118" x2="226" y2="172" stroke="#b1541b" stroke-width="2"/>
  <rect x="222" y="172" width="8" height="36" rx="3" fill="#b1541b"/>
  <line x1="226" y1="208" x2="226" y2="238" stroke="#b1541b" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="226" y="256" text-anchor="middle" font-size="13" fill="#b1541b" font-weight="700">tráfego proibido barrado aqui</text>
  <text x="226" y="274" text-anchor="middle" font-size="12" fill="#1d2057">não atravessa a rede à toa</text>

  <!-- ACL padrão (hipótese: perto do destino) -->
  <rect x="696" y="172" width="8" height="36" rx="3" fill="#f0e9f8" stroke="#7a4fb0" stroke-width="2" stroke-dasharray="3 2"/>
  <line x1="700" y1="208" x2="700" y2="236" stroke="#7a4fb0" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="550" y="236" width="300" height="26" rx="13" fill="#7a4fb0"/>
  <text x="700" y="253" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="700" class="inv">ACL padrão teria de ficar aqui</text>
  <text x="700" y="282" text-anchor="middle" font-size="13" fill="#1d2057">perto do destino: o pacote proibido</text>
  <text x="700" y="300" text-anchor="middle" font-size="13" fill="#1d2057">já teria cruzado o R1 e o R2</text>

  <!-- aparelhos -->
  <rect x="20" y="160" width="120" height="60" rx="8" fill="#e8f0f9" stroke="#1f5fa8" stroke-width="2"/>
  <text x="80" y="186" text-anchor="middle" font-size="15" fill="#1f5fa8" font-weight="600">PC-A1</text>
  <text x="80" y="206" text-anchor="middle" font-size="12" fill="#1d2057">origem</text>

  <rect x="260" y="160" width="120" height="60" rx="8" fill="#e8f0f9" stroke="#1f5fa8" stroke-width="2"/>
  <text x="320" y="186" text-anchor="middle" font-size="15" fill="#1f5fa8" font-weight="600">R1</text>
  <text x="320" y="206" text-anchor="middle" font-size="12" fill="#1d2057">perto da origem</text>

  <rect x="520" y="160" width="120" height="60" rx="8" fill="#e8f0f9" stroke="#1f5fa8" stroke-width="2"/>
  <text x="580" y="186" text-anchor="middle" font-size="15" fill="#1f5fa8" font-weight="600">R2</text>
  <text x="580" y="206" text-anchor="middle" font-size="12" fill="#1d2057">perto do destino</text>

  <rect x="760" y="160" width="120" height="60" rx="8" fill="#e5f3ec" stroke="#2e7d52" stroke-width="2"/>
  <text x="820" y="186" text-anchor="middle" font-size="15" fill="#2e7d52" font-weight="600">SRV-WEB</text>
  <text x="820" y="206" text-anchor="middle" font-size="12" fill="#1d2057">destino</text>

  <!-- rodapé -->
  <rect x="47" y="334" width="806" height="70" rx="8" fill="#eef1f6" stroke="#5a6473" stroke-width="2"/>
  <text x="450" y="361" text-anchor="middle" font-size="14" fill="#1d2057">Estendida: vê origem, destino e porta, então barra cedo, perto da origem.</text>
  <text x="450" y="385" text-anchor="middle" font-size="14" fill="#1d2057">Padrão: só vê a origem, então espera chegar perto do destino para não barrar o que é legítimo.</text>
</svg>
