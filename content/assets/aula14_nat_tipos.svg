<!-- BRIEF: os 3 sabores de NAT lado a lado, 3 paineis. (1) ESTATICO: 1 host privado -> 1 publico fixo, seta dupla permanente. (2) DINAMICO: 3 hosts -> pool de 2 publicos, primeiro chega primeiro usa. (3) PAT: 3 hosts -> 1 unico publico, separados por porta. Hand-drawn, halo off-white, fundo transparente, paleta Uniube. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="100%" role="img"
     font-family="'Comic Sans MS','Comic Neue',cursive"
     aria-label="Três painéis: NAT estático mapeia um privado para um público fixo; NAT dinâmico usa um pool de públicos; PAT coloca muitos privados num só público separados por porta">
  <defs>
    <style>
      .sk  { stroke-linecap:round; stroke-linejoin:round; fill:none; }
      .lbl { font-family:'Comic Sans MS','Comic Neue',cursive; }
      text { paint-order:stroke; stroke:#fafaf8; stroke-width:3px; stroke-linejoin:round; }
      text[fill="#ffffff"] { stroke:none; }
    </style>
    <marker id="t-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2778c4"/>
    </marker>
  </defs>

  <!-- TITULO -->
  <text x="450" y="36" text-anchor="middle" class="lbl" font-size="24" font-weight="bold" fill="#1d2057">Os três sabores do NAT</text>
  <path class="sk" d="M330,48 q60,7 120,3 q60,-4 120,2" stroke="#00aa9f" stroke-width="2.5"/>

  <!-- ============ PAINEL 1: ESTATICO ============ -->
  <g>
    <rect x="40" y="70" width="256" height="330" rx="14" class="sk" fill="#fbeee6" stroke="#b1541b" stroke-width="3"/>
    <text x="168" y="100" text-anchor="middle" class="lbl" font-size="17" font-weight="bold" fill="#b1541b">ESTÁTICO</text>
    <text x="168" y="120" text-anchor="middle" class="lbl" font-size="13" fill="#1d2057">1:1 fixo e permanente</text>
    <!-- host -->
    <rect x="80" y="150" width="120" height="44" rx="9" class="sk" fill="#ffffff" stroke="#b1541b" stroke-width="2.5"/>
    <text x="140" y="177" text-anchor="middle" class="lbl" font-size="14" fill="#1d2057">192.168.1.10</text>
    <!-- seta dupla -->
    <path class="sk" d="M140,200 q0,40 0,66" stroke="#b1541b" stroke-width="3" marker-end="url(#t-blue)" marker-start="url(#t-blue)"/>
    <text x="168" y="238" text-anchor="middle" class="lbl" font-size="12" fill="#b1541b">sempre</text>
    <!-- publico -->
    <rect x="80" y="272" width="176" height="44" rx="9" class="sk" fill="#ffffff" stroke="#b1541b" stroke-width="2.5"/>
    <text x="168" y="299" text-anchor="middle" class="lbl" font-size="14" fill="#b1541b">200.200.10.5</text>
    <!-- uso -->
    <text x="168" y="350" text-anchor="middle" class="lbl" font-size="13" font-weight="bold" fill="#1d2057">para servidor</text>
    <text x="168" y="368" text-anchor="middle" class="lbl" font-size="13" font-weight="bold" fill="#1d2057">publicável</text>
  </g>

  <!-- ============ PAINEL 2: DINAMICO ============ -->
  <g>
    <rect x="322" y="70" width="256" height="330" rx="14" class="sk" fill="#e4f0fb" stroke="#2778c4" stroke-width="3"/>
    <text x="450" y="100" text-anchor="middle" class="lbl" font-size="17" font-weight="bold" fill="#2778c4">DINÂMICO</text>
    <text x="450" y="120" text-anchor="middle" class="lbl" font-size="13" fill="#1d2057">pool sob demanda</text>
    <!-- hosts -->
    <rect x="340" y="148" width="86" height="36" rx="8" class="sk" fill="#ffffff" stroke="#2778c4" stroke-width="2"/>
    <text x="383" y="171" text-anchor="middle" class="lbl" font-size="12" fill="#1d2057">.10</text>
    <rect x="340" y="192" width="86" height="36" rx="8" class="sk" fill="#ffffff" stroke="#2778c4" stroke-width="2"/>
    <text x="383" y="215" text-anchor="middle" class="lbl" font-size="12" fill="#1d2057">.11</text>
    <rect x="340" y="236" width="86" height="36" rx="8" class="sk" fill="#ffffff" stroke="#2778c4" stroke-width="2"/>
    <text x="383" y="259" text-anchor="middle" class="lbl" font-size="12" fill="#1d2057">.12</text>
    <!-- setas para o pool -->
    <path class="sk" d="M428,166 q40,50 52,80" stroke="#2778c4" stroke-width="2.5" marker-end="url(#t-blue)"/>
    <path class="sk" d="M428,210 q30,30 50,40" stroke="#2778c4" stroke-width="2.5" marker-end="url(#t-blue)"/>
    <path class="sk" d="M428,254 q20,10 40,-4" stroke="#2778c4" stroke-width="2.5" marker-end="url(#t-blue)"/>
    <!-- pool -->
    <rect x="482" y="240" width="80" height="80" rx="10" class="sk" fill="#ffffff" stroke="#2778c4" stroke-width="2.5"/>
    <text x="522" y="264" text-anchor="middle" class="lbl" font-size="12" font-weight="bold" fill="#2778c4">POOL</text>
    <text x="522" y="282" text-anchor="middle" class="lbl" font-size="11" fill="#1d2057">.10–.14</text>
    <text x="522" y="300" text-anchor="middle" class="lbl" font-size="11" fill="#1d2057">5 pub.</text>
    <!-- aviso -->
    <text x="450" y="350" text-anchor="middle" class="lbl" font-size="13" font-weight="bold" fill="#b1541b">acabou o pool,</text>
    <text x="450" y="368" text-anchor="middle" class="lbl" font-size="13" font-weight="bold" fill="#b1541b">acabou a saída</text>
  </g>

  <!-- ============ PAINEL 3: PAT ============ -->
  <g>
    <rect x="604" y="70" width="256" height="330" rx="14" class="sk" fill="#eaf5ee" stroke="#2e7d52" stroke-width="3"/>
    <text x="732" y="100" text-anchor="middle" class="lbl" font-size="17" font-weight="bold" fill="#2e7d52">PAT / overload</text>
    <text x="732" y="120" text-anchor="middle" class="lbl" font-size="13" fill="#1d2057">muitos num só IP, por porta</text>
    <!-- hosts -->
    <rect x="620" y="148" width="80" height="36" rx="8" class="sk" fill="#ffffff" stroke="#2e7d52" stroke-width="2"/>
    <text x="660" y="171" text-anchor="middle" class="lbl" font-size="12" fill="#1d2057">.10</text>
    <rect x="620" y="192" width="80" height="36" rx="8" class="sk" fill="#ffffff" stroke="#2e7d52" stroke-width="2"/>
    <text x="660" y="215" text-anchor="middle" class="lbl" font-size="12" fill="#1d2057">.11</text>
    <rect x="620" y="236" width="80" height="36" rx="8" class="sk" fill="#ffffff" stroke="#2e7d52" stroke-width="2"/>
    <text x="660" y="259" text-anchor="middle" class="lbl" font-size="12" fill="#1d2057">.12</text>
    <!-- setas convergindo -->
    <path class="sk" d="M702,166 q50,60 60,96" stroke="#2e7d52" stroke-width="2.5" marker-end="url(#t-blue)"/>
    <path class="sk" d="M702,210 q36,36 56,58" stroke="#2e7d52" stroke-width="2.5" marker-end="url(#t-blue)"/>
    <path class="sk" d="M702,254 q24,14 48,20" stroke="#2e7d52" stroke-width="2.5" marker-end="url(#t-blue)"/>
    <!-- publico unico -->
    <rect x="758" y="262" width="86" height="56" rx="9" class="sk" fill="#ffffff" stroke="#2e7d52" stroke-width="2.5"/>
    <text x="801" y="284" text-anchor="middle" class="lbl" font-size="12" font-weight="bold" fill="#2e7d52">1 público</text>
    <text x="801" y="302" text-anchor="middle" class="lbl" font-size="11" fill="#1d2057">+portas</text>
    <!-- uso -->
    <text x="732" y="350" text-anchor="middle" class="lbl" font-size="13" font-weight="bold" fill="#1d2057">o roteador</text>
    <text x="732" y="368" text-anchor="middle" class="lbl" font-size="13" font-weight="bold" fill="#1d2057">da sua casa</text>
  </g>

  <!-- RODAPE -->
  <text x="450" y="436" text-anchor="middle" class="lbl" font-size="14" fill="#1d2057">Estático para publicar · dinâmico quando o pool basta · PAT quando o público é um só</text>
</svg>
