<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" role="img"
     aria-label="Topologia do Lab 2: um switch SW-LAB02 de 2960 com quatro computadores nas portas Fa0 barra 1 a Fa0 barra 4. PC-1 (192.168.1.11) e PC-2 (192.168.1.12) estao dentro de um contorno continuo marcado VLAN 10 FINANCEIRO; PC-3 (192.168.1.13) e PC-4 (192.168.1.14) estao dentro de outro contorno continuo marcado VLAN 20 RECEPCAO. Uma linha tracejada vertical atravessa o switch entre a porta 2 e a porta 3, indicando a fronteira onde o ping de 192.168.1.11 para 192.168.1.13 falha. Os quatro enderecos estao na mesma sub-rede 192.168.1.0 barra 24 e sem gateway">
  <!-- Fundo TRANSPARENTE: o mesmo arquivo serve aos tres modos.
       Nenhum traco e preto — preto sumiria no modo escuro.
       Vocabulario visual fixo do semestre:
         verde-agua = DOMINIO DE BROADCAST (o contorno continuo) — nao "a cor de uma VLAN"
         azul       = ESTACAO
         cinza      = equipamento, cabo, porta
         laranja    = o destaque unico da figura
       Quem distingue a VLAN 10 da 20 e o ROTULO, nao a cor: as duas sao dominios de broadcast. -->

  <!-- o switch: UM equipamento so -->
  <rect x="70" y="26" width="540" height="34" rx="6" fill="none" stroke="#8a8f98" stroke-width="2"/>
  <text x="340" y="48" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#8a8f98">SW-LAB02 · 2960</text>

  <g font-family="monospace">
    <!-- os quatro cabos, nas quatro portas -->
    <line x1="99"  y1="60" x2="99"  y2="112" stroke="#8a8f98" stroke-width="2"/>
    <line x1="261" y1="60" x2="261" y2="112" stroke="#8a8f98" stroke-width="2"/>
    <line x1="423" y1="60" x2="423" y2="112" stroke="#8a8f98" stroke-width="2"/>
    <line x1="585" y1="60" x2="585" y2="112" stroke="#8a8f98" stroke-width="2"/>

    <text x="99"  y="76" text-anchor="middle" font-size="10" fill="#8a8f98">Fa0/1</text>
    <text x="261" y="76" text-anchor="middle" font-size="10" fill="#8a8f98">Fa0/2</text>
    <text x="423" y="76" text-anchor="middle" font-size="10" fill="#8a8f98">Fa0/3</text>
    <text x="585" y="76" text-anchor="middle" font-size="10" fill="#8a8f98">Fa0/4</text>

    <!-- dominio de broadcast 1 -->
    <rect x="34" y="102" width="292" height="64" rx="8" fill="none" stroke="#00aa9f" stroke-width="2.5"/>
    <text x="180" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#00aa9f">VLAN 10 · FINANCEIRO</text>

    <!-- dominio de broadcast 2 -->
    <rect x="358" y="102" width="292" height="64" rx="8" fill="none" stroke="#00aa9f" stroke-width="2.5"/>
    <text x="504" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#00aa9f">VLAN 20 · RECEPCAO</text>

    <!-- as quatro estacoes -->
    <rect x="46"  y="112" width="106" height="44" rx="5" fill="none" stroke="#2778c4" stroke-width="2"/>
    <text x="99"  y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#2778c4">PC-1</text>
    <text x="99"  y="147" text-anchor="middle" font-size="11" fill="#2778c4">192.168.1.11</text>

    <rect x="208" y="112" width="106" height="44" rx="5" fill="none" stroke="#2778c4" stroke-width="2"/>
    <text x="261" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#2778c4">PC-2</text>
    <text x="261" y="147" text-anchor="middle" font-size="11" fill="#2778c4">192.168.1.12</text>

    <rect x="370" y="112" width="106" height="44" rx="5" fill="none" stroke="#2778c4" stroke-width="2"/>
    <text x="423" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#2778c4">PC-3</text>
    <text x="423" y="147" text-anchor="middle" font-size="11" fill="#2778c4">192.168.1.13</text>

    <rect x="532" y="112" width="106" height="44" rx="5" fill="none" stroke="#2778c4" stroke-width="2"/>
    <text x="585" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#2778c4">PC-4</text>
    <text x="585" y="147" text-anchor="middle" font-size="11" fill="#2778c4">192.168.1.14</text>
  </g>

  <!-- A SINALIZACAO: um destaque so por figura -->
  <line x1="340" y1="20" x2="340" y2="172" stroke="#d9702a" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="340" y="210" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#d9702a">e aqui que o ping do .11 para o .13 morre — antes do primeiro pacote</text>
  <text x="340" y="234" text-anchor="middle" font-family="monospace" font-size="10" fill="#8a8f98">os quatro na mesma sub-rede 192.168.1.0/24 · gateway em branco · nenhum cabo mudou de lugar</text>
</svg>
