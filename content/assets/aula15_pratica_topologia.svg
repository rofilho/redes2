<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 50 840 580" width="840" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title>Topologia da pratica: o R1 liga as redes Alunos, Professores e Servidores, uma em cada porta Gigabit</title>
  <defs>
    <style>
      text { paint-order: stroke; stroke: #fafaf8; stroke-width: 3px; stroke-linejoin: round; }
      text.inv { stroke: none; }
    </style>
  </defs>

  <!-- titulo -->
  <text x="400" y="92"text-anchor="middle" font-size="26" fill="#1d2057" font-weight="600">Um roteador, três redes: tudo fala com tudo, por enquanto</text>

  <!-- R1 central -->
  <rect x="310" y="150" width="180" height="92" rx="10" fill="#e8f0f9" stroke="#1f5fa8" stroke-width="2"/>
  <text x="400" y="186" text-anchor="middle" font-size="22" fill="#1f5fa8" font-weight="600">R1</text>
  <text x="400" y="210" text-anchor="middle" font-size="12" fill="#1d2057" font-family="monospace">roteador 2911</text>

  <!-- Alunos (esquerda) -->
  <line x1="310" y1="196" x2="230" y2="196" stroke="#8a8f98" stroke-width="2"/>
  <text x="270" y="186" text-anchor="middle" font-size="12" fill="#5a6473" font-family="monospace">g0/0</text>
  <rect x="20" y="130" width="210" height="132" rx="10" fill="#e5f3ec" stroke="#2e7d52" stroke-width="2"/>
  <text x="125" y="160" text-anchor="middle" font-size="18" fill="#2e7d52" font-weight="600">Alunos</text>
  <text x="125" y="182" text-anchor="middle" font-size="12" fill="#1d2057" font-family="monospace">192.168.10.0/24</text>
  <text x="125" y="212" text-anchor="middle" font-size="12" fill="#1d2057" font-family="monospace">PC-Aluno1 .10.11</text>
  <text x="125" y="234" text-anchor="middle" font-size="12" fill="#1d2057" font-family="monospace">PC-Aluno2 .10.50</text>

  <!-- Professores (direita) -->
  <line x1="490" y1="196" x2="570" y2="196" stroke="#8a8f98" stroke-width="2"/>
  <text x="530" y="186" text-anchor="middle" font-size="12" fill="#5a6473" font-family="monospace">g0/1</text>
  <rect x="570" y="140" width="210" height="112" rx="10" fill="#e5f3ec" stroke="#2e7d52" stroke-width="2"/>
  <text x="675" y="170" text-anchor="middle" font-size="18" fill="#2e7d52" font-weight="600">Professores</text>
  <text x="675" y="192" text-anchor="middle" font-size="12" fill="#1d2057" font-family="monospace">192.168.20.0/24</text>
  <text x="675" y="222" text-anchor="middle" font-size="12" fill="#1d2057" font-family="monospace">PC-Prof .20.11</text>

  <!-- Servidores (baixo) -->
  <line x1="400" y1="242" x2="400" y2="400" stroke="#8a8f98" stroke-width="2"/>
  <text x="420" y="320" text-anchor="start" font-size="12" fill="#5a6473" font-family="monospace">g0/2</text>
  <rect x="295" y="400" width="210" height="112" rx="10" fill="#e5f3ec" stroke="#2e7d52" stroke-width="2"/>
  <text x="400" y="430" text-anchor="middle" font-size="18" fill="#2e7d52" font-weight="600">Servidores</text>
  <text x="400" y="452" text-anchor="middle" font-size="12" fill="#1d2057" font-family="monospace">192.168.30.0/24</text>
  <text x="400" y="482" text-anchor="middle" font-size="12" fill="#1d2057" font-family="monospace">Servidor .30.10</text>

  <!-- rodape explicativo -->
  <rect x="60" y="548" width="680" height="62" rx="8" fill="#fbeee4" stroke="#b1541b" stroke-width="2"/>
  <text x="400" y="573" text-anchor="middle" font-size="14" fill="#1d2057">Cada rede pendura numa porta do R1. Sem ACL, o R1 encaminha tudo:</text>
  <text x="400" y="593" text-anchor="middle" font-size="14" fill="#1d2057">em qual porta, e em qual sentido, você poria o filtro dos Servidores?</text>
</svg>
