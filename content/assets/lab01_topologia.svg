<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" role="img"
     aria-label="Topologia do Lab 1: um switch SW-LAB01 de oito portas com quatro computadores ligados nas portas Fa0/1 a Fa0/4. PC-1 tem IP 192.168.1.11, PC-2 tem 192.168.1.12, PC-3 tem 192.168.1.13 e PC-4 tem 192.168.1.14, todos com mascara barra 24 e sem gateway">
  <!-- Fundo TRANSPARENTE: o mesmo arquivo serve aos tres modos.
       Nenhum traco e preto — preto sumiria no modo escuro. -->

  <!-- o switch -->
  <rect x="200" y="20" width="280" height="42" rx="7" fill="none" stroke="#00aa9f" stroke-width="2.5"/>
  <text x="340" y="47" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#00aa9f">SW-LAB01 · 2960</text>

  <!-- as quatro portas usadas -->
  <g fill="none" stroke="#8a8f98" stroke-width="1.5">
    <rect x="229" y="62" width="22" height="9" rx="2"/>
    <rect x="299" y="62" width="22" height="9" rx="2"/>
    <rect x="369" y="62" width="22" height="9" rx="2"/>
    <rect x="439" y="62" width="22" height="9" rx="2"/>
  </g>

  <!-- enlaces -->
  <g stroke="#8a8f98" stroke-width="2" fill="none">
    <path d="M240 71 L240 100 L90 100 L90 138"/>
    <path d="M310 71 L310 110 L250 110 L250 138"/>
    <path d="M380 71 L380 110 L430 110 L430 138"/>
    <path d="M450 71 L450 100 L590 100 L590 138"/>
  </g>

  <!-- rotulos de porta, deslocados para nao ficar sob o cabo -->
  <g font-family="monospace" font-size="10" fill="#8a8f98">
    <text x="196" y="86">Fa0/1</text>
    <text x="266" y="86">Fa0/2</text>
    <text x="336" y="86">Fa0/3</text>
    <text x="406" y="86">Fa0/4</text>
  </g>

  <!-- os quatro hosts -->
  <g font-family="monospace">
    <rect x="24" y="138" width="132" height="52" rx="6" fill="none" stroke="#2778c4" stroke-width="2.5"/>
    <text x="90" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#2778c4">PC-1</text>
    <text x="90" y="178" text-anchor="middle" font-size="11" fill="#2778c4">192.168.1.11</text>

    <rect x="184" y="138" width="132" height="52" rx="6" fill="none" stroke="#8a8f98" stroke-width="2"/>
    <text x="250" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a8f98">PC-2</text>
    <text x="250" y="178" text-anchor="middle" font-size="11" fill="#8a8f98">192.168.1.12</text>

    <rect x="364" y="138" width="132" height="52" rx="6" fill="none" stroke="#d9702a" stroke-width="2.5"/>
    <text x="430" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#d9702a">PC-3</text>
    <text x="430" y="178" text-anchor="middle" font-size="11" fill="#d9702a">192.168.1.13</text>

    <rect x="524" y="138" width="132" height="52" rx="6" fill="none" stroke="#d9702a" stroke-width="2.5"/>
    <text x="590" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#d9702a">PC-4</text>
    <text x="590" y="178" text-anchor="middle" font-size="11" fill="#d9702a">192.168.1.14</text>
  </g>

  <!-- A SINALIZACAO: um destaque so por figura -->
  <text x="340" y="216" text-anchor="middle" font-family="monospace" font-size="12" fill="#d9702a">o PC-3 e o PC-4 ficam calados quase a aula inteira — e e isso que se vai medir</text>
  <text x="340" y="238" text-anchor="middle" font-family="monospace" font-size="10" fill="#8a8f98">mascara 255.255.255.0 nos quatro · gateway em branco · ninguem sai da rede hoje</text>
</svg>
