<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" role="img"
     aria-label="Duas cenas. Na primeira, o computador A envia um ARP Request com destino FF:FF:FF:FF:FF:FF e o switch replica a pergunta para os computadores B e C, mas nao de volta para o A. Na segunda, so o computador C responde, com um ARP Reply enderecado ao MAC do A, e o switch entrega por uma unica porta">
  <defs>
    <marker id="setaLaranja" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9702a"/>
    </marker>
    <marker id="setaAzul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2778c4"/>
    </marker>
  </defs>

  <!-- ============ CENA 1: A PERGUNTA ============ -->
  <text x="24" y="22" font-family="monospace" font-size="13" font-weight="bold" fill="#d9702a">1 · A PERGUNTA — ARP Request</text>

  <rect x="180" y="30" width="476" height="28" rx="14" fill="none" stroke="#8a8f98" stroke-width="1.5"/>
  <text x="196" y="49" font-family="monospace" font-size="12" fill="#8a8f98">"Quem tiver o IP 10.0.0.8, conte o seu MAC para o 10.0.0.1"</text>

  <rect x="270" y="72" width="140" height="32" rx="6" fill="none" stroke="#00aa9f" stroke-width="2.5"/>
  <text x="340" y="93" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#00aa9f">SW-ACESSO-01</text>

  <path d="M100 142 L100 88 L264 88" fill="none" stroke="#2778c4" stroke-width="2.5" marker-end="url(#setaAzul)"/>
  <path d="M340 104 L340 136" fill="none" stroke="#d9702a" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#setaLaranja)"/>
  <path d="M416 88 L580 88 L580 136" fill="none" stroke="#d9702a" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#setaLaranja)"/>

  <rect x="30" y="142" width="140" height="32" rx="6" fill="none" stroke="#2778c4" stroke-width="2.5"/>
  <text x="100" y="163" text-anchor="middle" font-family="monospace" font-size="12" fill="#2778c4">A · 10.0.0.1</text>

  <rect x="270" y="142" width="140" height="32" rx="6" fill="none" stroke="#8a8f98" stroke-width="2"/>
  <text x="340" y="163" text-anchor="middle" font-family="monospace" font-size="12" fill="#8a8f98">B · 10.0.0.4</text>

  <rect x="510" y="142" width="140" height="32" rx="6" fill="none" stroke="#d9702a" stroke-width="2.5"/>
  <text x="580" y="163" text-anchor="middle" font-family="monospace" font-size="12" fill="#d9702a">C · 10.0.0.8</text>

  <text x="24" y="192" font-family="monospace" font-size="12" fill="#d9702a">MAC de destino FF:FF:FF:FF:FF:FF — o switch replica em todas as portas, menos na de entrada</text>

  <line x1="24" y1="206" x2="656" y2="206" stroke="#8a8f98" stroke-width="1" stroke-dasharray="4 5"/>

  <!-- ============ CENA 2: A RESPOSTA ============ -->
  <text x="24" y="234" font-family="monospace" font-size="13" font-weight="bold" fill="#2778c4">2 · A RESPOSTA — ARP Reply</text>

  <rect x="180" y="242" width="476" height="28" rx="14" fill="none" stroke="#8a8f98" stroke-width="1.5"/>
  <text x="196" y="261" font-family="monospace" font-size="12" fill="#8a8f98">"O 10.0.0.8 esta em AA:AA:AA:AA:AA:A7"</text>

  <rect x="270" y="284" width="140" height="32" rx="6" fill="none" stroke="#00aa9f" stroke-width="2.5"/>
  <text x="340" y="305" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#00aa9f">SW-ACESSO-01</text>

  <path d="M580 354 L580 300 L416 300" fill="none" stroke="#d9702a" stroke-width="2.5" marker-end="url(#setaLaranja)"/>
  <path d="M300 316 L300 330 L100 330 L100 348" fill="none" stroke="#2778c4" stroke-width="2.5" marker-end="url(#setaAzul)"/>

  <rect x="30" y="354" width="140" height="32" rx="6" fill="none" stroke="#2778c4" stroke-width="2.5"/>
  <text x="100" y="375" text-anchor="middle" font-family="monospace" font-size="12" fill="#2778c4">A · 10.0.0.1</text>

  <rect x="270" y="354" width="140" height="32" rx="6" fill="none" stroke="#8a8f98" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="340" y="375" text-anchor="middle" font-family="monospace" font-size="12" fill="#8a8f98">B · nao responde</text>

  <rect x="510" y="354" width="140" height="32" rx="6" fill="none" stroke="#d9702a" stroke-width="2.5"/>
  <text x="580" y="375" text-anchor="middle" font-family="monospace" font-size="12" fill="#d9702a">C · 10.0.0.8</text>

  <text x="24" y="406" font-family="monospace" font-size="12" fill="#2778c4">MAC de destino AA:AA:AA:AA:AA:A0 — o do A, que perguntou. Um destino so, uma porta so</text>
</svg>
